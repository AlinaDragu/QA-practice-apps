<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank — Deschide cont</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #eef2f6;
    color: #1c2733;
    min-height: 100vh;
    padding: 40px 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 460px;
    margin: 0 auto;
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(20, 40, 70, 0.12);
    padding: 30px 30px 26px;
    position: relative;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .brand .dot { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, #0a5cff, #00b3a4); }
  .brand span { font-weight: 700; font-size: 16px; }

  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #6b7a8d; margin-bottom: 20px; }

  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #35485c; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #c6d2df;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
    background: #fff;
  }
  input:focus, select:focus { border-color: #0a5cff; box-shadow: 0 0 0 3px rgba(10, 92, 255, .15); }

  /* BUG 10: fixed pixel widths instead of flex — the two fields spill outside
     the card on narrow / mobile viewports */
  .row-fixed { display: flex; gap: 12px; }
  .row-fixed .field { width: 150px; }

  .strength { font-size: 12px; margin-top: 5px; font-weight: 600; }
  .strength.weak { color: #b3261e; }
  .strength.mid { color: #b26a00; }
  .strength.strong { color: #1b7a3d; }

  .checks { margin: 6px 0 4px; }
  .check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; color: #35485c; margin-bottom: 8px; }
  .check input { width: auto; margin-top: 2px; }
  .check a { color: #0a5cff; }

  button {
    width: 100%;
    padding: 12px;
    background: #0a5cff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 8px;
  }
  button:hover { background: #0949cc; }

  .msg { font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: #fdecea; color: #b3261e; }
  .msg.success { display: block; background: #e7f5ec; color: #1b7a3d; }

  .log { margin-top: 22px; }
  .log h2 { font-size: 13px; color: #6b7a8d; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .log ul { list-style: none; font-size: 13px; }
  .log li { padding: 8px 0; border-bottom: 1px solid #edf1f5; color: #35485c; }
  .log li:last-child { border-bottom: none; }
  .log .empty { color: #a3b1c0; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="dot"></div><span>Meridian Bank</span></div>
    <h1>Deschide cont curent</h1>
    <div class="sub">Completează datele tale pentru a crea un cont nou.</div>

    <form id="regForm" novalidate>
      <div class="field">
        <label for="nameField">Nume complet</label>
        <!-- BUG 8: tabindex 1 -->
        <input type="text" id="nameField" name="name" placeholder="Ion Popescu" tabindex="1">
      </div>

      <div class="field">
        <label for="emailField">Adresă de email</label>
        <!-- BUG 1: type="text", and no format validation in JS either -->
        <!-- BUG 8: tabindex 20 — reached only after every other control -->
        <input type="text" id="emailField" name="email" placeholder="nume@exemplu.ro" tabindex="20">
      </div>

      <div class="field">
        <label for="email2Field">Confirmă adresa de email</label>
        <!-- BUG 8: tabindex 21 -->
        <input type="text" id="email2Field" name="email2" placeholder="nume@exemplu.ro" tabindex="21">
      </div>

      <div class="field">
        <label for="passField">Parolă</label>
        <!-- BUG 4: type="text" — parola nu este mascată -->
        <!-- BUG 8: tabindex 2 -->
        <input type="text" id="passField" name="password" tabindex="2">
        <div class="strength" id="strength"></div>
      </div>

      <div class="field">
        <label for="pass2Field">Confirmă parola</label>
        <!-- BUG 4 (contrast): acest câmp ESTE mascat, deci comportamentul e inconsecvent -->
        <!-- BUG 8: tabindex 3 -->
        <input type="password" id="pass2Field" name="password2" tabindex="3">
      </div>

      <div class="row-fixed">
        <div class="field">
          <label for="cnpField">CNP</label>
          <!-- BUG 6: no length / digit validation -->
          <!-- BUG 8: tabindex 4 -->
          <input type="text" id="cnpField" name="cnp" maxlength="20" tabindex="4">
        </div>
        <div class="field">
          <label for="dobField">Data nașterii</label>
          <!-- BUG 7: no minimum-age check, future dates accepted -->
          <!-- BUG 8: tabindex 5 -->
          <input type="date" id="dobField" name="dob" tabindex="5">
        </div>
      </div>

      <div class="field">
        <!-- BUG 9: 'for' points to an id that does not exist (field id is phoneField) -->
        <label for="telField">Telefon</label>
        <!-- BUG 8: tabindex 6 -->
        <input type="text" id="phoneField" name="phone" placeholder="07xx xxx xxx" tabindex="6">
      </div>

      <div class="field">
        <label for="countyField">Județ</label>
        <!-- BUG 8: tabindex 7 -->
        <select id="countyField" name="county" tabindex="7">
          <option value="AB">Alba</option>
          <option value="B">București</option>
          <option value="CJ">Cluj</option>
          <option value="IS">Iași</option>
          <option value="TM">Timiș</option>
        </select>
      </div>

      <div class="checks">
        <label class="check">
          <input type="checkbox" id="terms">
          <span>Sunt de acord cu <a href="#" id="termsLink">termenii și condițiile</a>.</span>
        </label>
        <label class="check">
          <!-- BUG 12: marketing consent is pre-checked by default -->
          <input type="checkbox" id="promo" checked>
          <span>Vreau să primesc oferte și noutăți pe email.</span>
        </label>
      </div>

      <!-- BUG 8: tabindex 8 -->
      <button type="submit" id="createBtn" tabindex="8">Creează cont</button>
      <div class="msg" id="message"></div>
    </form>

    <div class="log">
      <h2>Conturi create</h2>
      <ul id="logList"><li class="empty">Niciun cont încă.</li></ul>
    </div>
  </div>

<script>
  var form = document.getElementById("regForm");
  var nameEl = document.getElementById("nameField");
  var emailEl = document.getElementById("emailField");
  var email2El = document.getElementById("email2Field");
  var passEl = document.getElementById("passField");
  var pass2El = document.getElementById("pass2Field");
  var cnpEl = document.getElementById("cnpField");
  var dobEl = document.getElementById("dobField");
  var phoneEl = document.getElementById("phoneField");
  var countyEl = document.getElementById("countyField");
  var termsEl = document.getElementById("terms");
  var strengthEl = document.getElementById("strength");
  var msg = document.getElementById("message");
  var logList = document.getElementById("logList");

  // BUG 3: strength meter reports "Puternică" for any non-empty password
  passEl.addEventListener("input", function () {
    var p = passEl.value;
    if (!p) { strengthEl.textContent = ""; return; }
    strengthEl.className = "strength strong";
    strengthEl.textContent = "Putere parolă: Puternică";
  });

  // BUG 13 (reasoning trap): phone field auto-formats as you type and SILENTLY
  // truncates anything past 10 digits — no warning, no validation message.
  phoneEl.addEventListener("input", function () {
    var d = phoneEl.value.replace(/\D/g, "").slice(0, 10);
    var out = d;
    if (d.length > 7) out = d.slice(0, 4) + " " + d.slice(4, 7) + " " + d.slice(7);
    else if (d.length > 4) out = d.slice(0, 4) + " " + d.slice(4);
    phoneEl.value = out;
  });

  // BUG 14: terms & conditions link is dead
  document.getElementById("termsLink").addEventListener("click", function (e) {
    e.preventDefault();
    return false;
  });

  function show(type, text) {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  function addLogEntry(text) {
    var empty = logList.querySelector(".empty");
    if (empty) empty.remove();
    var li = document.createElement("li");
    li.textContent = text;
    logList.appendChild(li);
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var name = nameEl.value.trim();
    var email = emailEl.value.trim();
    var email2 = email2El.value.trim();
    var pass = passEl.value;
    var pass2 = pass2El.value;
    var cnp = cnpEl.value.trim();
    var dob = dobEl.value;

    if (!name) { show("error", "Introdu numele complet."); return; }

    // BUG 1: only checks non-empty — no "@" / format check at all
    if (!email) { show("error", "Introdu adresa de email."); return; }

    // BUG 2: the "confirmă email" field is never compared to the first one

    if (!pass) { show("error", "Introdu o parolă."); return; }

    // BUG 5: "match" check compares only the LENGTH of the two passwords
    if (pass.length !== pass2.length) {
      show("error", "Parolele nu coincid.");
      return;
    }

    // BUG 6: only checks non-empty — no 13-digit / numeric check
    if (!cnp) { show("error", "Introdu CNP-ul."); return; }

    // BUG 7: date of birth is not validated for minimum age or future dates
    if (!dob) { show("error", "Introdu data nașterii."); return; }

    if (!termsEl.checked) {
      show("error", "Trebuie să accepți termenii și condițiile.");
      return;
    }

    // BUG 11: button is never disabled and there is no in-flight guard —
    // rapid clicks create multiple accounts
    show("success", "Cont creat pentru " + email + ".");
    addLogEntry(new Date().toLocaleTimeString("ro-RO") + " — " + name + " <" + email + "> · jud. " + countyEl.value);
  });
</script>
</body>
</html>
