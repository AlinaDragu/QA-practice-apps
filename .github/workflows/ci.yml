name: Teste Selenium

on: 
  push:
  workflow_dispatch:
  

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - name: Descarc codul
        uses: actions/checkout@v4
      - name: Instaleaza pachetele
        run: npm ci
        working-directory: selenium-tests
      - name: Ruleaza testele
        run: npx jest
        working-directory: selenium-tests