<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank — Autentificare</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card">
    <div class="brand"><div class="dot"></div><span>Meridian Bank</span></div>

    <h1>Bine ai revenit</h1>
    <p class="subtitle">Autentifică-te în contul tău Meridian</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <!-- BUG 9: label not linked to input (no for/id pair) -->
        <label>Adresă de email</label>
        <input type="email" name="email" id="emailField" tabindex="1" autocomplete="username">
      </div>

      <div class="field">
        <!-- BUG 9: label not linked to input -->
        <!-- BUG 7: password rendered as plain text, never masked -->
        <!-- BUG 5: tab order broken — tabindex jumps past this field -->
        <label>Parolă</label>
        <input type="text" name="password" id="passwordField" tabindex="3" autocomplete="current-password">
      </div>

      <div class="row-between">
        <!-- BUG 3: dead "forgot password" link -->
        <a href="#" class="forgot" id="forgotLink">Ai uitat parola?</a>
      </div>

      <!-- BUG 5: submit gets tabindex 2, so Tab goes email -> button, skipping password -->
      <button type="submit" id="submitBtn" tabindex="2">Autentificare</button>

      <div class="msg" id="message"></div>
    </form>

    <p class="hint">Cont demo: client@meridian.ro / Parola123</p>
  </div>

<script src="script.js"></script>
</body>
</html>
