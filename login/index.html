<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Bank — Autentificare</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #eef2f6;
    color: #1c2733;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    width: 100%;
    max-width: 380px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(20, 40, 70, 0.12);
    padding: 36px 32px 32px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 26px;
  }
  .brand .dot {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #0a5cff, #00b3a4);
  }
  .brand span { font-weight: 700; font-size: 18px; letter-spacing: .3px; }

  /* BUG 8: heading and subtitle overlap — negative margin pulls subtitle onto the h1 */
  h1 { font-size: 22px; margin-bottom: 4px; }
  .subtitle { color: #6b7a8d; font-size: 14px; margin-top: -22px; margin-bottom: 22px; }

  .field { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #35485c; }
  input[type="email"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #c6d2df;
    border-radius: 8px;
    font-size: 15px;
    outline: none;
  }
  input:focus { border-color: #0a5cff; box-shadow: 0 0 0 3px rgba(10, 92, 255, .15); }

  .row-between { display: flex; justify-content: space-between; align-items: center; margin: 6px 0 20px; }
  .forgot { color: #0a5cff; font-size: 13px; text-decoration: none; }
  .forgot:hover { text-decoration: underline; }

  button {
    width: 100%;
    padding: 12px;
    background: #0a5cff;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #0949cc; }

  .msg { font-size: 13px; margin-top: 14px; padding: 10px 12px; border-radius: 8px; display: none; }
  .msg.error { display: block; background: #fdecea; color: #b3261e; }
  .msg.success { display: block; background: #e7f5ec; color: #1b7a3d; }

  .hint { margin-top: 20px; font-size: 12px; color: #90a0b0; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="dot"></div><span>Meridian Bank</span></div>

    <h1>Bine ai revenit</h1>
    <p class="subtitle">Autentifică-te în contul tău Meridian</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <!-- BUG 9: label not linked to input (no for/id pair) -->
        <label>Adresă de email</label>
        <input type="email" name="email" id="emailField" tabindex="1" autocomplete="username">
      </div>

      <div class="field">
        <!-- BUG 9: label not linked to input -->
        <!-- BUG 7: password rendered as plain text, never masked -->
        <!-- BUG 5: tab order broken — tabindex jumps past this field -->
        <label>Parolă</label>
        <input type="text" name="password" id="passwordField" tabindex="3" autocomplete="current-password">
      </div>

      <div class="row-between">
        <!-- BUG 3: dead "forgot password" link -->
        <a href="#" class="forgot" id="forgotLink">Ai uitat parola?</a>
      </div>

      <!-- BUG 5: submit gets tabindex 2, so Tab goes email -> button, skipping password -->
      <button type="submit" id="submitBtn" tabindex="2">Autentificare</button>

      <div class="msg" id="message"></div>
    </form>

    <p class="hint">Cont demo: client@meridian.ro / Parola123</p>
  </div>

<script>
  var VALID_EMAIL = "client@meridian.ro";
  var VALID_PASSWORD = "Parola123";

  var form = document.getElementById("loginForm");
  var emailEl = document.getElementById("emailField");
  var passEl = document.getElementById("passwordField");
  var msg = document.getElementById("message");
  var submitBtn = document.getElementById("submitBtn");

  // BUG 3: link handler does nothing useful
  document.getElementById("forgotLink").addEventListener("click", function (e) {
    e.preventDefault();
    // TODO: hook up password reset flow
  });

  function show(type, text) {
    msg.className = "msg " + type;
    msg.textContent = text;
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();

    var email = emailEl.value;
    var password = passEl.value;

    // BUG 1: empty-field messages are inverted
    if (!email) {
      show("error", "Parola introdusă este greșită.");
      return;
    }

    // BUG 4: SQL-injection-style input bypasses authentication (before the
    // password is even checked — payload in the email field is enough)
    if (email.indexOf("'--") !== -1 || email.toLowerCase().indexOf(" or 1=1") !== -1) {
      show("success", "Autentificare reușită. Te redirecționăm...");
      return;
    }

    if (!password) {
      show("error", "Adresa de email este obligatorie.");
      return;
    }

    // BUG 6: button is never disabled, so rapid clicks fire multiple "requests"
    show("error", "");
    msg.className = "msg";
    submitBtn.textContent = "Se verifică...";

    setTimeout(function () {
      submitBtn.textContent = "Autentificare";

      if (email !== VALID_EMAIL) {
        // BUG 2: wrong message for unknown email vs wrong password is swapped/confused
        show("error", "Cont inexistent.");
        return;
      }
      if (password !== VALID_PASSWORD) {
        // BUG 2: says "account not found" when the real problem is the password
        show("error", "Cont inexistent.");
        return;
      }
      show("success", "Autentificare reușită. Te redirecționăm...");
    }, 700);
  });
</script>
</body>
</html>
